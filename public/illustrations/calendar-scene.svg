<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none">
  <title>A wall calendar with marked dates, a medicine strip and a phone showing an emergency card</title>
  <!-- soft ground -->
  <ellipse cx="280" cy="440" rx="230" ry="22" fill="#0b6b60" opacity=".08"/>

  <!-- wall calendar -->
  <g transform="rotate(-3 250 230)">
    <rect x="96" y="70" width="300" height="340" rx="22" fill="#fff"/>
    <rect x="96" y="70" width="300" height="340" rx="22" stroke="#e4e6e2" stroke-width="2"/>
    <path d="M96 92a22 22 0 0 1 22-22h256a22 22 0 0 1 22 22v44H96V92Z" fill="#0b6b60"/>
    <rect x="150" y="52" width="14" height="40" rx="7" fill="#08524a"/>
    <rect x="328" y="52" width="14" height="40" rx="7" fill="#08524a"/>
    <text x="122" y="118" fill="#fff" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="-.5">NOVEMBER</text>
    <g font-family="Archivo, Arial, sans-serif" font-weight="700" font-size="17" fill="#14181b">
      <text x="122" y="176" fill="#d8261c">1</text><text x="162" y="176">2</text><text x="202" y="176">3</text><text x="242" y="176">4</text><text x="282" y="176">5</text><text x="322" y="176">6</text><text x="358" y="176">7</text>
      <text x="122" y="222" fill="#d8261c">8</text><text x="162" y="222">9</text><text x="196" y="222">10</text><text x="236" y="222">11</text><text x="276" y="222">12</text><text x="316" y="222">13</text><text x="354" y="222">14</text>
      <text x="116" y="268" fill="#d8261c">15</text><text x="156" y="268">16</text><text x="196" y="268">17</text><text x="236" y="268">18</text><text x="276" y="268">19</text><text x="316" y="268">20</text><text x="354" y="268">21</text>
      <text x="116" y="314" fill="#d8261c">22</text><text x="156" y="314">23</text><text x="196" y="314">24</text><text x="236" y="314">25</text><text x="276" y="314">26</text><text x="316" y="314">27</text><text x="354" y="314">28</text>
      <text x="116" y="360" fill="#d8261c">29</text><text x="156" y="360">30</text>
    </g>
    <!-- today -->
    <rect x="150" y="152" width="34" height="34" rx="10" fill="#0b6b60"/>
    <text x="162" y="176" fill="#fff" font-family="Archivo, Arial, sans-serif" font-weight="700" font-size="17">2</text>
    <!-- due soon ring and overdue mark -->
    <circle cx="326" cy="262" r="21" stroke="#f2a900" stroke-width="4"/>
    <circle cx="244" cy="326" r="4.5" fill="#3b6fd8"/><circle cx="256" cy="326" r="4.5" fill="#8c4fbf"/>
    <circle cx="206" cy="234" r="4.5" fill="#2e8540"/>
  </g>

  <!-- medicine strip -->
  <g transform="rotate(14 420 330)">
    <rect x="330" y="290" width="190" height="86" rx="14" fill="#dfe3e1"/>
    <rect x="330" y="290" width="190" height="86" rx="14" stroke="#cfd3cd" stroke-width="2"/>
    <g fill="#fff" stroke="#c4cac5" stroke-width="2">
      <rect x="346" y="304" width="34" height="24" rx="12"/><rect x="390" y="304" width="34" height="24" rx="12"/><rect x="434" y="304" width="34" height="24" rx="12"/><rect x="478" y="304" width="30" height="24" rx="12"/>
      <rect x="346" y="338" width="34" height="24" rx="12"/><rect x="390" y="338" width="34" height="24" rx="12"/><rect x="434" y="338" width="34" height="24" rx="12"/>
    </g>
    <rect x="482" y="342" width="22" height="16" rx="8" fill="#cfd3cd"/>
    <rect x="356" y="312" width="14" height="8" rx="4" fill="#f2a900"/><rect x="400" y="312" width="14" height="8" rx="4" fill="#f2a900"/>
  </g>

  <!-- phone with emergency card -->
  <g>
    <rect x="44" y="232" width="138" height="232" rx="26" fill="#14181b"/>
    <rect x="53" y="244" width="120" height="208" rx="18" fill="#fff"/>
    <rect x="94" y="250" width="38" height="7" rx="3.5" fill="#14181b"/>
    <rect x="65" y="272" width="96" height="24" rx="8" fill="#fdecea"/>
    <path d="M77 278c0 0-4.5 5-4.5 7.8a4.5 4.5 0 0 0 9 0c0-2.8-4.5-7.8-4.5-7.8Z" fill="#d8261c"/>
    <rect x="88" y="280" width="62" height="8" rx="4" fill="#a61b13" opacity=".7"/>
    <text x="65" y="330" fill="#14181b" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="30">O+</text>
    <rect x="65" y="342" width="70" height="7" rx="3.5" fill="#cfd3cd"/>
    <rect x="65" y="364" width="96" height="30" rx="9" fill="#e6f2f0"/>
    <rect x="73" y="374" width="54" height="10" rx="5" fill="#0b6b60" opacity=".55"/>
    <rect x="65" y="402" width="96" height="30" rx="9" fill="#f4f5f2"/>
    <rect x="73" y="412" width="40" height="10" rx="5" fill="#6b747a" opacity=".5"/>
  </g>
</svg>
