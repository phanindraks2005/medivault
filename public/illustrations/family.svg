<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <title>Four family members, each in their own colour, standing in front of a calendar leaf</title>
  <ellipse cx="260" cy="368" rx="220" ry="18" fill="#0b6b60" opacity=".08"/>
  <!-- calendar leaf behind -->
  <rect x="150" y="40" width="220" height="230" rx="22" fill="#fff" stroke="#e4e6e2" stroke-width="2"/>
  <path d="M150 62a22 22 0 0 1 22-22h176a22 22 0 0 1 22 22v34H150V62Z" fill="#0b6b60"/>
  <rect x="196" y="24" width="12" height="34" rx="6" fill="#08524a"/>
  <rect x="312" y="24" width="12" height="34" rx="6" fill="#08524a"/>
  <text x="260" y="196" text-anchor="middle" fill="#14181b" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="88">2</text>
  <rect x="226" y="214" width="68" height="9" rx="4.5" fill="#cfd3cd"/>

  <!-- father -->
  <g>
    <circle cx="110" cy="208" r="30" fill="#f1d3b8"/>
    <path d="M80 200c2-22 16-30 30-30s28 8 30 30c-8-10-18-13-30-13s-22 3-30 13Z" fill="#5b6b7f"/>
    <path d="M58 360c0-62 23-100 52-100s52 38 52 100H58Z" fill="#3b6fd8"/>
  </g>
  <!-- mother -->
  <g>
    <circle cx="200" cy="232" r="27" fill="#d9a988"/>
    <path d="M171 236c-2-26 12-40 29-40s32 14 29 40c-4-14-14-20-29-20s-25 6-29 20Z" fill="#2b2420"/>
    <path d="M150 360c0-54 22-88 50-88s50 34 50 88H150Z" fill="#8c4fbf"/>
  </g>
  <!-- you -->
  <g>
    <circle cx="318" cy="214" r="28" fill="#c98f6d"/>
    <path d="M290 210c1-22 14-32 28-32s27 10 28 32c-7-9-16-12-28-12s-21 3-28 12Z" fill="#2b2420"/>
    <path d="M266 360c0-60 23-96 52-96s52 36 52 96H266Z" fill="#0e7c9a"/>
  </g>
  <!-- child -->
  <g>
    <circle cx="414" cy="262" r="22" fill="#e2b493"/>
    <path d="M392 258c1-17 10-25 22-25s21 8 22 25c-6-7-13-9-22-9s-16 2-22 9Z" fill="#3a2d25"/>
    <path d="M376 360c0-44 17-72 38-72s38 28 38 72H376Z" fill="#2e8540"/>
  </g>
  <!-- small date badges -->
  <g font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="14">
    <rect x="70" y="112" width="58" height="30" rx="15" fill="#fff5db"/><text x="99" y="132" text-anchor="middle" fill="#7a5300">20 NOV</text>
    <rect x="392" y="166" width="58" height="30" rx="15" fill="#e6f2f0"/><text x="421" y="186" text-anchor="middle" fill="#08524a">25 NOV</text>
  </g>
</svg>
